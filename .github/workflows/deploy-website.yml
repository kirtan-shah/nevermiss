name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest DMG URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_URL=$(gh api repos/${{ github.repository }}/releases/latest \
            --jq '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' \
            2>/dev/null || true)
          if [ -z "$DMG_URL" ]; then
            DMG_URL="https://github.com/${{ github.repository }}/releases/latest"
          fi
          DMG_URL="$DMG_URL" node -e '
            const fs = require("node:fs");
            const path = "website/src/pages/download_latest_release.astro";
            const source = fs.readFileSync(path, "utf8");
            const next = source.replace(
              /const url = .*;/,
              `const url = ${JSON.stringify(process.env.DMG_URL)};`,
            );
            fs.writeFileSync(path, next);
          '
          echo "DMG_URL=$DMG_URL"

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
