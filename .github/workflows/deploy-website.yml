name: Deploy Website

on:
  push:
    paths:
      - 'appcast.xml'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment runs at a time; in-progress runs are not cancelled
# so a release-triggered deploy always finishes even if a manual one queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve latest DMG URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_URL=$(gh api repos/${{ github.repository }}/releases/latest \
            --jq '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' \
            2>/dev/null || true)
          if [ -z "$DMG_URL" ]; then
            DMG_URL="https://github.com/${{ github.repository }}/releases/latest"
          fi
          sed -i "s|const url = \".*\";|const url = \"$DMG_URL\";|" \
            website/src/pages/download_latest_release.astro
          echo "DMG_URL=$DMG_URL"

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
